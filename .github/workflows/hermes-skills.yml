name: Hermes skill export

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Hermes compatibility export
        run: python scripts/export_hermes_skills.py
